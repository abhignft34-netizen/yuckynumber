<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Yucky Bot</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(circle at top, #34304b, #11101a 65%);
    color: #f7f3ff; font-family: system-ui, Arial, sans-serif;
    padding: 20px;
  }
  .app {
    width: min(100%, 620px); background: #1b1928; border: 1px solid #51476b;
    border-radius: 22px; overflow: hidden; box-shadow: 0 24px 80px #0008;
  }
  header {
    padding: 22px 24px; background: #29243b; border-bottom: 1px solid #51476b;
    display: flex; align-items: center; gap: 13px;
  }
  .avatar {
    width: 48px; height: 48px; display: grid; place-items: center;
    background: #b8f34a; color: #191925; border-radius: 15px;
    font-size: 25px; font-weight: 900;
  }
  h1 { margin: 0; font-size: 21px; }
  .status { color: #b8f34a; font-size: 12px; margin-top: 3px; }
  #chat {
    height: 360px; overflow-y: auto; padding: 22px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .bubble {
    max-width: 82%; padding: 12px 15px; border-radius: 16px;
    line-height: 1.4; overflow-wrap: anywhere;
  }
  .bot { align-self: flex-start; background: #302b42; border-bottom-left-radius: 5px; }
  .user { align-self: flex-end; background: #b8f34a; color: #171820; border-bottom-right-radius: 5px; }
  .composer {
    display: flex; gap: 10px; padding: 17px; background: #242133;
    border-top: 1px solid #51476b;
  }
  input {
    flex: 1; min-width: 0; border: 1px solid #625875; border-radius: 12px;
    background: #151320; color: white; padding: 13px 14px; font: inherit;
    outline: none;
  }
  input:focus { border-color: #b8f34a; }
  button {
    border: 0; border-radius: 12px; padding: 0 19px; font: 700 14px inherit;
    background: #b8f34a; color: #171820; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled, input:disabled { opacity: .5; cursor: not-allowed; }
  .hint { text-align: center; color: #a49bb8; font-size: 12px; padding: 0 15px 17px; }
  #kicked {
    display: none; position: fixed; inset: 0; z-index: 5; place-items: center;
    text-align: center; padding: 25px; background: #09080d;
  }
  #kicked.show { display: grid; animation: appear .35s ease-out; }
  .kick-card { max-width: 520px; }
  .stamp { color: #ff5470; font-size: clamp(42px, 10vw, 76px); font-weight: 1000; letter-spacing: -3px; }
  .kick-card p { color: #c7c0d3; font-size: 17px; }
  .kick-card button { padding: 13px 20px; margin-top: 12px; }
  @keyframes appear { from { opacity: 0; transform: scale(1.04); } to { opacity: 1; transform: scale(1); } }
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="avatar">Y</div>
    <div><h1>Yucky Bot</h1><div class="status">● ONLINE · EXTREMELY UNHELPFUL</div></div>
  </header>
  <section id="chat" aria-live="polite">
    <div class="bubble bot">Hello. I am Yucky Bot. Ask me literally anything.</div>
  </section>
  <form class="composer" id="form">
    <input id="message" autocomplete="off" placeholder="Type something..." aria-label="Your message">
    <button id="send" type="submit">Send</button>
  </form>
  <div class="hint">Warning: this bot has exactly one response. You have been warned.</div>
</main>

<section id="kicked" role="alertdialog" aria-modal="true" aria-labelledby="kick-title">
  <div class="kick-card">
    <div class="stamp" id="kick-title">YOU'RE KICKED.</div>
    <p>The Yucky Bot has decided you are too powerful for this chat.</p>
    <button id="again">Try getting kicked again</button>
  </div>
</section>

<script>
  const form = document.getElementById('form');
  const input = document.getElementById('message');
  const chat = document.getElementById('chat');
  const kicked = document.getElementById('kicked');

  function addBubble(text, type) {
    const bubble = document.createElement('div');
    bubble.className = `bubble ${type}`;
    bubble.textContent = text;
    chat.appendChild(bubble);
    chat.scrollTop = chat.scrollHeight;
  }

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    addBubble(message, 'user');
    input.value = '';
    input.disabled = true;
    document.getElementById('send').disabled = true;

    setTimeout(() => {
      addBubble('yucky number', 'bot');
      setTimeout(() => kicked.classList.add('show'), 900);
    }, 450);
  });

  document.getElementById('again').addEventListener('click', () => {
    kicked.classList.remove('show');
    chat.innerHTML = '<div class="bubble bot">Hello. I am Yucky Bot. Ask me literally anything.</div>';
    input.disabled = false;
    document.getElementById('send').disabled = false;
    input.focus();
  });
</script>
</body>
</html>
